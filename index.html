<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homodynamics</title>

  <style>
    /* Root layout for React app */
    #root {
      display: flex;
      min-height: 100vh;
    }

    body {
      margin: 0;
      background-color: #FDFBF6;
      color: #3A3A3A;
      font-family: 'Georgia', serif;
    }
    /* Custom Scrollbar for a refined look */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F1F1;
    }
    ::-webkit-scrollbar-thumb {
      background: #C1C1C1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A8A8A8;
    }
  </style>
  <style>
    /* Responsive Styles */
    .menu-button {
      display: none; /* Hidden by default */
      position: fixed;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 1001;
      background: #FCFBF8;
      border: 1px solid #EAE8E1;
      border-radius: 4px;
      width: 44px;
      height: 44px;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      -webkit-tap-highlight-color: transparent;
    }
    .menu-button div {
      width: 100%;
      height: 2px;
      background-color: #3A3A3A;
      margin: 5px 0;
      transition: transform 0.3s ease;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
    .overlay.is-visible {
      display: block;
      opacity: 1;
    }

    @media (max-width: 800px) {
      html {
        height: 100%;
        width: 100%;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      #root {
        flex-direction: column !important;
        min-height: 100vh !important;
        width: 100% !important;
      }

      .sidebar {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        z-index: 1000 !important;
        transform: translateX(-100%) !important;
        transition: transform 0.3s ease-in-out;
        box-shadow: 4px 0px 15px rgba(0,0,0,0.1) !important;
        border-right: none !important;
        width: 100% !important;
        max-width: none !important;
        height: 100vh !important;
      }

      .sidebar.is-open {
        transform: translateX(0) !important;
      }

      .menu-button {
        display: block !important;
      }

      .overlay {
        display: block !important;
      }

      .main-content {
        flex: 1 !important;
        width: 100% !important;
        padding: 1rem 2.5rem !important;
        margin: 0 !important;
        height: auto !important;
        min-height: 100vh !important;
        overflow-y: visible !important;
        box-sizing: border-box !important;
        display: block !important;
      }

      /* Mobile: Override desktop full-height sections */
      .main-content > div {
        min-height: auto !important;
        margin-bottom: 2rem !important;
        display: block !important;
        flex-direction: initial !important;
        justify-content: initial !important;
        padding: 0 !important;
      }

      .main-content > div:first-child .hero {
        min-height: 250px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
      }

      .hero {
        margin: 0 !important;
        min-height: 250px !important;
        height: auto !important;
        padding: 2rem 2.5rem !important;
        width: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
      }

      .hero-title-container {
        flex-direction: row !important;
        align-items: baseline !important;
        justify-content: center !important;
        flex-wrap: nowrap !important; /* Force no wrapping */
        gap: 0 !important;
        white-space: nowrap !important; /* Prevent text wrapping */
        overflow: visible !important;
      }

      .hero-word {
        font-size: clamp(1.5rem, 8vw, 3rem) !important; /* Smaller for mobile */
        white-space: nowrap !important;
        display: inline-block !important;
      }

      .hero-plus {
        font-size: clamp(1.5rem, 8vw, 3rem) !important;
        margin: 0 0.3rem !important; /* Smaller margin */
        white-space: nowrap !important;
        display: inline-block !important;
      }

      .section-page-grid {
        display: grid !important;
        grid-template-columns: 55% 40% !important;
        gap: 5% !important;
      }

      .section-page-viz {
        position: sticky !important;
        top: 2rem !important;
        align-self: flex-start !important;
      }

      .section-page .content {
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .section-page .viz {
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .footer {
        padding: 1rem 2.5rem !important;
        margin: 0 !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .sub-section {
        flex-direction: column !important;
      }

      .sub-section canvas {
        width: 100% !important;
        height: 250px !important;
      }

      /* Typography adjustments */
      h2 {
        font-size: 2rem !important;
      }
      h3 {
        font-size: 1.5rem !important;
      }
      h4 {
        font-size: 1.25rem !important;
      }
    }
  </style>
